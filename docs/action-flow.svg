<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <title>ecobrowser verified, self-healing action flow</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="340" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="480" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Verified, self-healing action</text>
  <text x="480" y="58" text-anchor="middle" font-size="12" fill="#64748b">What happens when the AI clicks, types or selects an element by id</text>

  <rect x="30" y="110" width="150" height="64" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <text x="105" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Act by id</text>
  <text x="105" y="158" text-anchor="middle" font-size="11" fill="#64748b">click / type / select</text>

  <rect x="230" y="110" width="150" height="64" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <text x="305" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Run action</text>
  <text x="305" y="158" text-anchor="middle" font-size="11" fill="#64748b">retry on plain errors</text>

  <rect x="430" y="110" width="150" height="64" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <text x="505" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Verify effect</text>
  <text x="505" y="158" text-anchor="middle" font-size="11" fill="#64748b">did the page change?</text>

  <rect x="650" y="110" width="270" height="64" rx="10" fill="#dcfce7" stroke="#4ade80"/>
  <text x="785" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">ActionResult</text>
  <text x="785" y="158" text-anchor="middle" font-size="11" fill="#166534">ok, and whether the page changed</text>

  <rect x="230" y="230" width="150" height="64" rx="10" fill="#ede9fe" stroke="#a78bfa"/>
  <text x="305" y="258" text-anchor="middle" font-size="13" font-weight="700" fill="#4c1d95">Self-heal</text>
  <text x="305" y="278" text-anchor="middle" font-size="11" fill="#5b21b6">re-locate by identity, retry</text>

  <rect x="650" y="230" width="270" height="64" rx="10" fill="#fee2e2" stroke="#f87171"/>
  <text x="785" y="256" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">ActionResult (failed)</text>
  <text x="785" y="276" text-anchor="middle" font-size="11" fill="#991b1b">maybeApplied is never retried,</text>
  <text x="785" y="290" text-anchor="middle" font-size="11" fill="#991b1b">so a form is never submitted twice</text>

  <g stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M180 142H228"/>
    <path d="M380 142H428"/>
    <path d="M580 142H648"/>
    <path d="M305 174V228"/>
    <path d="M380 262H648"/>
    <path d="M360 230L450 176"/>
  </g>
  <g font-size="10.5" fill="#64748b">
    <text x="200" y="206">id moved</text>
    <text x="590" y="136">success</text>
    <text x="470" y="254">still failing</text>
    <text x="425" y="220">healed</text>
  </g>
</svg>
