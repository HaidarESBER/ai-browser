<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <title>ecobrowser architecture</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="440" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="480" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Architecture</text>
  <text x="480" y="58" text-anchor="middle" font-size="12" fill="#64748b">One engine, two front doors: an MCP server for AI clients and a TypeScript library</text>

  <rect x="40" y="110" width="170" height="80" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <text x="125" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">AI client</text>
  <text x="125" y="162" text-anchor="middle" font-size="11" fill="#64748b">Claude Desktop, Claude Code,</text>
  <text x="125" y="177" text-anchor="middle" font-size="11" fill="#64748b">Cursor, your agent</text>

  <rect x="290" y="110" width="190" height="80" rx="10" fill="#ede9fe" stroke="#a78bfa"/>
  <text x="385" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">mcp.ts</text>
  <text x="385" y="162" text-anchor="middle" font-size="11" fill="#5b21b6">MCP server, 22 tools</text>
  <text x="385" y="177" text-anchor="middle" font-size="11" fill="#5b21b6">(ecobrowser-mcp bin)</text>

  <rect x="290" y="260" width="190" height="80" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <text x="385" y="292" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Your TypeScript app</text>
  <text x="385" y="312" text-anchor="middle" font-size="11" fill="#64748b">import { AIBrowser }</text>
  <text x="385" y="327" text-anchor="middle" font-size="11" fill="#64748b">from "ecobrowser"</text>

  <rect x="560" y="170" width="190" height="100" rx="10" fill="#6E56CF" stroke="#4C3A9E"/>
  <text x="655" y="205" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">browser.ts</text>
  <text x="655" y="226" text-anchor="middle" font-size="11" fill="#ede9fe">AIBrowser / AIPage</text>
  <text x="655" y="242" text-anchor="middle" font-size="11" fill="#ede9fe">perceive, act, verify, heal</text>

  <rect x="800" y="110" width="130" height="70" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <text x="865" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Chromium</text>
  <text x="865" y="160" text-anchor="middle" font-size="11" fill="#64748b">via Playwright</text>

  <rect x="800" y="270" width="130" height="70" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <text x="865" y="300" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">live.ts</text>
  <text x="865" y="320" text-anchor="middle" font-size="11" fill="#64748b">live view, loopback</text>

  <rect x="560" y="360" width="190" height="52" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <text x="655" y="382" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Human</text>
  <text x="655" y="399" text-anchor="middle" font-size="11" fill="#64748b">watches screenshot + action trace</text>

  <g stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M210 150H288"/>
    <path d="M480 150L558 190"/>
    <path d="M480 300L558 250"/>
    <path d="M750 200L798 160"/>
    <path d="M750 245L798 290"/>
    <path d="M865 340L750 380"/>
  </g>
  <g font-size="10.5" fill="#64748b" text-anchor="middle">
    <text x="249" y="140">JSON-RPC</text>
    <text x="249" y="168">stdio</text>
    <text x="515" y="158" transform="rotate(27 515 158)">method calls</text>
    <text x="515" y="268" transform="rotate(-27 515 268)">method calls</text>
    <text x="785" y="142" text-anchor="end">CDP</text>
    <text x="792" y="312" text-anchor="end">events, frames</text>
  </g>
</svg>
